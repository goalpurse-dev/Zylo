import * as THREE from "three";
import { OBJECT_CATALOG, HOLDABLE, heldKind } from "/lib/visuals.js";
import { CREATURES, HELD } from "/lib/catalog.js";
const out = { objects: 0, held: 0, monsters: 0, errors: [], fallbackHeld: [] };
try {
  const { makeObject, animateObject, resolveObject, OBJECTS } = await import("/page/kit/objects.js");
  const { makeHeld } = await import("/page/kit/props.js");
  const { makeMonster, animateMonster } = await import("/page/kit/monsters.js");
  for (const [name, c] of Object.entries(OBJECT_CATALOG)) {
    if (resolveObject(name) !== name) out.errors.push(`object ${name}: not in kit/objects.js OBJECTS`);

    catch (e) { out.errors.push(`monster ${v}/${sp}: ${e.message}`); }
  }

window.kitCheck = out;
