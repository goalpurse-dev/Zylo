# M3 STAGING: the Cutaway render worker's Fly app. It holds the image in Fly's registry (RunPod pulls it from
# registry.fly.io with a deploy token scoped to this app) and runs the CPU fallback as one-off machines.
# No services, no always-on machine. Never the Long Form app (zyvo-render).
app = "zyvo-cutaway-render-staging"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
