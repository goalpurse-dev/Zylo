<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">



    <!-- SEO: this is only the bare pre-render template default. Every real
         route's title/description/canonical/robots/og:*/JSON-LD is injected
         by scripts/generateSeoHtml.js at build time (see buildHead/injectHead
         there) — that script's output is the single source of truth for
         crawlable metadata. Do not add title/meta/og/JSON-LD tags here: they
         would ship unchanged on any route the generator doesn't reprocess,
         and previously did exactly that (a stray WebSite JSON-LD block and
         a generic title/description leaked onto every prerendered page). -->
    <title>Zyvo</title>

    <!-- Brand identity -->
    <meta name="application-name" content="Zyvo" />
    <meta name="apple-mobile-web-app-title" content="Zyvo" />
    <meta property="og:site_name" content="Zyvo" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
