# Real incident fixed 2026-09-15: this worker's own recovery cron
# (private.trigger_long_form_scene_generation_recovery, every minute) calls
# it with ONLY a custom x-recovery-secret header, no Authorization bearer
# token — matching every OTHER advance-long-form-* worker's cron-calling
# convention above. Without this entry the function defaulted to
# verify_jwt=true, so Supabase's own JWT gateway rejected the cron's request
# with a 401 BEFORE the function's own (already strong) x-cron-secret/
# x-recovery-secret check ever ran — the recovery cron silently failed
# every single invocation. This is the same already-established, already-
# audited pattern the three siblings above use: verify_jwt=false here is
# safe ONLY because the function's own custom secret check (unchanged) is
# the real authentication gate.
[functions.start-long-form-scene-generation]
verify_jwt = true

[functions.advance-long-form-scene-generation]
verify_jwt = false

